name: Build and Push Docker Images to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-api:${{ github.sha }} ./api
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-api:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-frontend:${{ github.sha }}

      - name: Build and push collector image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-collector:${{ github.sha }} ./collector
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/monitoring-collector:${{ github.sha }}

      - name: Validate Docker Compose config
        run: docker compose config